<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日程App - 清空数据</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f0f7ff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:16px;padding:32px 24px;max-width:360px;width:100%;text-align:center;box-shadow:0 2px 12px rgba(74,144,217,0.15)}
h1{font-size:22px;color:#333;margin-bottom:8px}
p{color:#666;font-size:14px;line-height:1.6;margin-bottom:20px}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;font-size:17px;font-weight:600;cursor:pointer;margin-bottom:12px}
.btn-danger{background:#FF3B30;color:#fff}
.btn-danger:disabled{background:#ccc}
.btn-cancel{background:#f0f0f0;color:#666}
.status{margin-top:16px;padding:12px;border-radius:10px;font-size:14px;display:none}
.status.show{display:block}
.status.ok{background:#d4edda;color:#155724}
.status.working{background:#d1ecf1;color:#0c5460}
.status.err{background:#f8d7da;color:#721c24}
.icon{font-size:48px;margin-bottom:12px}
</style>
</head>
<body>
<div class="card">
<div class="icon">🗑️</div>
<h1>清空日程数据</h1>
<p>这将清除所有日程、Todo和日记数据，重新开始记录。云端数据已经清空，此操作清除本地缓存。</p>
<button class="btn btn-danger" id="resetBtn" onclick="doReset()">确认清空所有数据</button>
<button class="btn btn-cancel" onclick="location.href='./'">取消，返回日程App</button>
<div id="status" class="status"></div>
</div>
<script>
function show(msg,cls){
  var s=document.getElementById('status');
  s.className='status show '+(cls||'');
  s.innerHTML=msg;
}
async function doReset(){
  var btn=document.getElementById('resetBtn');
  btn.disabled=true;
  btn.textContent='清除中...';
  show('⏳ 正在清除本地数据...','working');
  
  try{
    // 1. Clear all storage
    localStorage.clear();
    sessionStorage.clear();
    show('⏳ 正在注销Service Worker...','working');
    
    // 2. Unregister all service workers
    if('serviceWorker' in navigator){
      var regs=await navigator.serviceWorker.getRegistrations();
      for(var i=0;i<regs.length;i++){await regs[i].unregister();}
    }
    
    // 3. Clear all caches
    if('caches' in window){
      var names=await caches.keys();
      for(var i=0;i<names.length;i++){await caches.delete(names[i]);}
    }
    
    show('✅ 所有数据已清除！3秒后跳转到全新的日程App...','ok');
    
    setTimeout(function(){
      // Hard reload the app with cache-busting
      location.replace(location.origin + location.pathname.replace('reset.html','') + '?t=' + Date.now());
    }, 3000);
    
  }catch(e){
    show('❌ 出错: '+e.message,'err');
    btn.disabled=false;
    btn.textContent='确认清空所有数据';
  }
}
</script>
</body>
</html>
